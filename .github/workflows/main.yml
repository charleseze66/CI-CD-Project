name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Test Application
        run: |
          node server.js &
          sleep 5
          curl http://localhost:3000

      - name: Build Docker Image
        run: docker build -t cicd-app .
